name: Bug Report
description: Submit a bug report (reproduction steps, expected/actual behavior, environment info)
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! The primary repository is on [GitLab](https://home.chenkaidi.top:509/chenkaidi/daymark/-/issues);
        this repository is a source mirror. If you find issues on the GitLab side, you can also report them there directly.
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What happened? A one-sentence summary
      placeholder: e.g. GitLab commits are missing from materials when generating the daily report
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      description: List the minimal reproduction path step by step
      placeholder: |
        1. Open the settings page and configure the GitLab token
        2. Click "Refresh now" to collect materials
        3. Switch to the daily report page and click "Generate report"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Attach error screenshots/logs if any
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & Stack Traces
      description: App logs, exception stack traces, terminal output, etc. (use "Copy diagnostics" on the settings page About section)
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Version number and build time from the settings page About section
      placeholder: e.g. 0.3.1 (built 2026-08-15)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux (X11)
        - Linux (Wayland)
        - Windows
    validations:
      required: true
