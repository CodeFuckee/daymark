name: Bug 报告
description: 提交缺陷报告（复现步骤、预期/实际行为、环境信息）
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告 Bug！主仓库在 [GitLab](https://home.chenkaidi.top:509/chenkaidi/daymark/-/issues)，
        本仓库为源码镜像；如你在 GitLab 侧发现问题也可直接在那里提交。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？一句话概述
      placeholder: 例如：日报生成时 GitLab 提交未合并进素材
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 按步骤列出最小复现路径
      placeholder: |
        1. 打开设置页配置 GitLab token
        2. 点击「立即刷新」采集素材
        3. 切换到日报页点击「生成日报」
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？如有报错截图/日志请附上
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与堆栈
      description: 应用日志、异常堆栈、终端输出等（可用设置页「复制诊断信息」一键复制）
      render: text
  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置页「关于」板块中的版本号与构建时间
      placeholder: 例如：0.3.1（2026-08-15 构建）
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Linux（X11）
        - Linux（Wayland）
        - Windows
    validations:
      required: true
