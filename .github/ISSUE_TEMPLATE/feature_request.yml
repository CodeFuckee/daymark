name: Feature Request
description: Propose a new feature or improvement (requirement background, expected behavior, acceptance criteria)
title: "feature: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! The primary repository is on [GitLab](https://home.chenkaidi.top:509/chenkaidi/daymark/-/issues);
        this repository is a source mirror. If you have ideas on the GitLab side, you can also submit them there directly.
  - type: textarea
    id: background
    attributes:
      label: Requirement Background
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: The concrete behavior of the feature (entry points, interactions, outputs)
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What counts as done? (a checkable list)
      placeholder: |
        - [ ] New toggle on the settings page
        - [ ] Configuration persists after restart
    validations:
      required: true
  - type: textarea
    id: edge
    attributes:
      label: Edge Cases
      description: Expected behavior under empty input, invalid arguments, concurrency, offline, etc.
  - type: textarea
    id: context
    attributes:
      label: Additional Information
      description: Related screenshots, reference implementations, alternatives, etc.
