# Daymark 三平台构建（DESIGN.md §6.2）：push tag v* 或手动触发
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: daymark-linux-x64.tar.gz
          - os: macos-latest
            artifact: daymark-macos.dmg
          - os: windows-latest
            artifact: daymark-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev libsecret-1-dev \
            ninja-build clang cmake pkg-config libgtk-3-dev
          flutter build linux --release
          tar -czf ${{ matrix.artifact }} -C build/linux/x64/release/bundle .

      - name: Build macOS (ad-hoc 签名)
        if: matrix.os == 'macos-latest'
        run: |
          ./scripts/sign_macos.sh
          hdiutil create \
            -volname Daymark \
            -srcfolder build/macos/Build/Products/Release/daymark.app \
            -ov -format UDZO ${{ matrix.artifact }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          flutter build windows --release
          cd build/windows/x64/runner/Release
          powershell Compress-Archive -Path * \
            -DestinationPath "$GITHUB_WORKSPACE/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
