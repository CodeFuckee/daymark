[package]
name = "daymark_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
pdf-extract = "0.8"
notify = "8"
global-hotkey = "0.6"
once_cell = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
